name: Release

on:
  push:
    branches: [main]

# Never run two releases in parallel and never cancel a running release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push version-bump commit + tag + sync develop
  pull-requests: write # attach changelog to GitHub Release

jobs:
  release:
    name: Version & Changelog
    runs-on: ubuntu-latest
    # Skip the release commit itself — nx release adds "[skip ci]" to its
    # commit message. GitHub Actions also honours that flag natively.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history lets nx release walk back to the previous tag.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release — bump version, write changelog, tag, create GitHub Release
        # --skip-publish and --yes are mutually exclusive in Nx 20+; skip-publish is enough in CI.
        run: npx nx release --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Sync release commit back to develop ──────────────────────────────
      # After `nx release` the only commit on main that develop doesn't have
      # is the version-bump commit (package.json + CHANGELOG.md).
      # Because develop was the direct parent of main before this push,
      # a fast-forward merge is always safe here.
      # Without this step, the next develop → main release PR would conflict
      # on CHANGELOG.md and package.json.
      - name: Sync release commit back to develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge --ff-only origin/main
          git push origin develop
