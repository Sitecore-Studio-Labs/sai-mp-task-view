# Optional: run snyk fix and open a PR with lockfile/manifest updates (manual dispatch; quota-aware).
# Review and merge like any dependency bump; combine with local snyk test before approving.
name: Security - Dependency auto-fix (PR)

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to fix (usually main)"
        required: true
        default: "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: security-snyk-fix-${{ github.workflow }}-${{ github.event.inputs.base_branch }}
  cancel-in-progress: true

jobs:
  snyk-fix:
    name: Snyk fix + propose PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Apply Snyk remediations to manifest/lockfile
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk fix

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.inputs.base_branch }}
          branch: chore/snyk-fix-${{ github.run_id }}
          delete-branch: true
          title: "chore(security): Snyk dependency remediations"
          commit-message: "chore(security): apply snyk fix"
          body: |
            Automated `snyk fix` from workflow **Security - Dependency auto-fix (PR)**.

            **Please verify** locally:
            - `npm ci`
            - `npm run build`
            - `snyk test --severity-threshold=high`
            - `snyk code test --severity-threshold=high`
