# After merge to main: upload dependency snapshot to Snyk for continuous monitoring/alerts.
# Uses the same lockfile resolution as CI (npm ci) so the graph matches production intent.
name: Security - Monitor (Snyk)

on:
  push:
    branches:
      - main

concurrency:
  group: security-monitor-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  snyk-monitor:
    name: Snyk monitor (Open Source snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # Monitor registers the project; do not fail main on pre-existing findings (PR/release already gate severity).
      - name: Snyk monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects
