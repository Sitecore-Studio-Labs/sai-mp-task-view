# Mandatory secret exposure detection (complements Snyk; catches credentials in git history).
name: Security - Secrets (Gitleaks)

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: security-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout (full history for effective secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned major: bump intentionally when adopting new Gitleaks defaults
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
