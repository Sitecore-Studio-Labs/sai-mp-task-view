# Mandatory secret exposure detection (complements Snyk; catches credentials in git history).
# Uses the OSS Gitleaks binary — gitleaks/gitleaks-action@v2 requires GITLEAKS_LICENSE for GitHub org-owned repos.
name: Security - Secrets (Gitleaks)

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: security-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pin for reproducible scans; bump when you want new rules: https://github.com/gitleaks/gitleaks/releases
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout (full history for effective secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact
