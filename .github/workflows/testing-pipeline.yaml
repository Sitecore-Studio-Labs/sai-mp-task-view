name: Testing Pipeline

permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".vscode/**"
      - ".claude/**"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: testing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Build-time env for Next.js (compile only — not production secrets).
env:
  SKIP_ENV_VALIDATION: "true"
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder-service-role-key
  JIRA_CLIENT_ID: ci-build-placeholder-client-id
  JIRA_CLIENT_SECRET: ci-build-placeholder-client-secret
  JIRA_REDIRECT_URI: http://127.0.0.1:3000/api/auth/jira/callback

jobs:
  # ── Setup: Detect changes and cache dependencies ────────────────────────────────
  setup:
    name: Detect changes & setup cache
    runs-on: ubuntu-latest
    outputs:
      dependencies: ${{ steps.changes.outputs.dependencies }}
      capabilities: ${{ steps.changes.outputs.capabilities }}
      shadows: ${{ steps.changes.outputs.shadows }}
      is_release: ${{ steps.release.outputs.is_release }}
      has_code_changes: ${{ steps.has_changes.outputs.result }}

    steps:
      - name: Checkout (full history for NX affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filters: |
            dependencies:
              - package.json
              - package-lock.json
            capabilities:
              - capabilities/**
              - tools/audit-capabilities.js
              - tools/check-capability-drift.js
              - tools/generators/**
            shadows:
              - libs/ui/**
              - apps/**/components/**
              - tools/check-shadows.js

      - name: Release PR flag
        id: release
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if there are code changes
        id: has_changes
        run: |
          if [ "${{ steps.changes.outputs.dependencies }}" = "true" ] || \
             [ "${{ steps.changes.outputs.capabilities }}" = "true" ] || \
             [ "${{ steps.changes.outputs.shadows }}" = "true" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

  # ── Compliance checks (no code changes needed) ────────────────────────────────
  compliance:
    name: Compliance (format, deps, licenses)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit

      - name: Check dependency licenses
        if: needs.setup.outputs.dependencies == 'true' || needs.setup.outputs.is_release == 'true'
        run: npm run license:check

      - name: Generate SBOM
        if: needs.setup.outputs.dependencies == 'true' || needs.setup.outputs.is_release == 'true'
        run: npm run sbom

      - name: Upload SBOM artifact
        if: success() && (needs.setup.outputs.dependencies == 'true' || needs.setup.outputs.is_release == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.event.pull_request.number || github.run_id }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Check formatting
        run: npm run format:check

  # ── Lint & Typecheck: Fast parallel checks (fail fast) ────────────────────────
  lint-check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout (full history for NX affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive affected base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check shadow file coverage
        if: needs.setup.outputs.shadows == 'true'
        run: npm run check:shadows

      - name: Typecheck shadow components
        if: needs.setup.outputs.shadows == 'true'
        run: npm run typecheck:shadows

      - name: Check capability drift
        if: needs.setup.outputs.capabilities == 'true'
        run: npm run check:capability-drift

      - name: Audit capabilities (platform apps)
        if: needs.setup.outputs.capabilities == 'true'
        run: |
          PROJECTS=$(npx nx show projects --with-target=audit-capabilities | paste -sd, -)
          if [ -n "$PROJECTS" ]; then
            npx nx run-many --target=audit-capabilities --projects="$PROJECTS" --parallel=3
          else
            echo "No platform apps with audit-capabilities target."
          fi

      - name: Lint affected projects
        run: npx nx affected --target=lint --parallel=3

      - name: Typecheck affected projects
        run: npx nx affected --target=typecheck --parallel=3

  # ── Test & Build: Skipped if lint/typecheck fails (fail fast) ────────────────
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: [setup, lint-check]
    if: needs.setup.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout (full history for NX affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive affected base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test affected projects
        run: npx nx affected --target=test --parallel=3 ${{ needs.setup.outputs.is_release == 'true' && '--coverage' || '' }}

      - name: Build affected projects
        run: npx nx affected --target=build --parallel=3

      - name: Upload coverage reports
        if: needs.setup.outputs.is_release == 'true'
        uses: codecov/codecov-action@v4
        with:
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # E2E / Playwright CI disabled for initial monorepo release — see docs/guides/contributing.md
      - name: E2E (skipped — post-MVP)
        run: echo "Playwright E2E is disabled in CI for the initial release. Run locally with npm run e2e."

  # ── E2E: Playwright (affected apps only) ──────────────────────────────────────
  e2e:
    name: E2E (nx affected)
    needs: [setup, test-build]
    if: needs.setup.outputs.has_code_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for NX affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive affected base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Detect affected E2E projects
        id: e2e-affected
        run: |
          PROJECTS=$(npx nx show projects --affected --with-target=e2e | paste -sd, -)
          if [ -z "$PROJECTS" ]; then
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
            echo "No affected projects with an e2e target."
          else
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Affected E2E projects: $PROJECTS"
          fi

      - name: Cache Playwright browsers
        if: steps.e2e-affected.outputs.has_e2e == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-

      - name: Install Playwright Chromium (with system deps)
        if: steps.e2e-affected.outputs.has_e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright Chromium (cache hit)
        if: steps.e2e-affected.outputs.has_e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Build affected projects for E2E
        if: steps.e2e-affected.outputs.has_e2e == 'true'
        run: npx nx affected --target=build --parallel=1

      - name: Run E2E tests
        if: steps.e2e-affected.outputs.has_e2e == 'true'
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PREBUILT: "true"
        run: npx nx affected --target=e2e --parallel=1

  # ── Final Status ───────────────────────────────────────────────────────────────
  workflow-status:
    name: Workflow Status
    runs-on: ubuntu-latest
    needs:
      - setup
      - compliance
      - lint-check
      - test-build
      - e2e
    if: always()

    steps:
      - name: Success message
        if: |
          needs.compliance.result == 'success' &&
          (needs.lint-check.result == 'success' || needs.lint-check.result == 'skipped') &&
          (needs.test-build.result == 'success' || needs.test-build.result == 'skipped') &&
          (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "All required checks passed."

      - name: Failure message
        if: |
          needs.compliance.result == 'failure' ||
          needs.lint-check.result == 'failure' ||
          needs.test-build.result == 'failure' ||
          needs.e2e.result == 'failure'
        run: |
          echo "❌ Pipeline failed!"
          echo "One or more jobs failed."
          exit 1
