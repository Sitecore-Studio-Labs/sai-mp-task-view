name: Testing Pipeline

permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".vscode/**"
      - ".claude/**"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: testing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test, Build (nx affected)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    # Next.js "collect page data" imports API routes at build time (e.g. authStrategy → Supabase).
    # Placeholders satisfy module-load checks only; real secrets belong in deployment env.
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder-service-role-key
      JIRA_CLIENT_ID: ci-build-placeholder-client-id
      JIRA_CLIENT_SECRET: ci-build-placeholder-client-secret
      JIRA_REDIRECT_URI: http://127.0.0.1:3000/api/auth/jira/callback

    steps:
      - name: Checkout (full history for NX affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          # Git diff (not GitHub listFiles API) — avoids "Resource not accessible by integration"
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filters: |
            dependencies:
              - package.json
              - package-lock.json
            capabilities:
              - capabilities/**
              - tools/audit-capabilities.js
              - tools/check-capability-drift.js
              - tools/generators/**
            shadows:
              - libs/ui/**
              - apps/**/components/**
              - tools/check-shadows.js

      - name: Release PR flag
        id: release
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive affected base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Security (always — fast gate) ─────────────────────────────────────

      - name: Dependency audit
        run: npm run audit

      - name: Check dependency licenses
        if: steps.changes.outputs.dependencies == 'true' || steps.release.outputs.is_release == 'true'
        run: npm run license:check

      - name: Generate SBOM
        if: steps.changes.outputs.dependencies == 'true' || steps.release.outputs.is_release == 'true'
        run: npm run sbom

      - name: Upload SBOM artifact
        if: success() && (steps.changes.outputs.dependencies == 'true' || steps.release.outputs.is_release == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.event.pull_request.number || github.run_id }}
          path: sbom.cdx.json
          retention-days: 90

      # ── Monorepo health (conditional) ─────────────────────────────────────

      - name: Check shadow file coverage
        if: steps.changes.outputs.shadows == 'true'
        run: npm run check:shadows

      - name: Typecheck shadow components
        if: steps.changes.outputs.shadows == 'true'
        run: npm run typecheck:shadows

      - name: Check capability drift
        if: steps.changes.outputs.capabilities == 'true'
        run: npm run check:capability-drift

      - name: Audit capabilities (platform apps)
        if: steps.changes.outputs.capabilities == 'true'
        run: |
          PROJECTS=$(npx nx show projects --with-target=audit-capabilities | paste -sd, -)
          if [ -n "$PROJECTS" ]; then
            npx nx run-many --target=audit-capabilities --projects="$PROJECTS" --parallel=3
          else
            echo "No platform apps with audit-capabilities target."
          fi

      # ── NX affected: lint, typecheck, test, build ─────────────────────────

      - name: Check formatting
        run: npm run format:check

      - name: Lint affected projects
        run: npx nx affected --target=lint --parallel=3

      - name: Typecheck affected projects
        run: npx nx affected --target=typecheck --parallel=3

      - name: Test affected projects
        run: npx nx affected --target=test --parallel=3 --coverage

      - name: Build affected projects
        run: npx nx affected --target=build --parallel=3

      # ── E2E: only when affected apps declare an e2e target ────────────────

      - name: Detect affected E2E projects
        id: e2e
        run: |
          PROJECTS=$(npx nx show projects --affected --with-target=e2e --base="$NX_BASE" --head="$NX_HEAD" | tr '\n' ' ')
          echo "projects=${PROJECTS}" >> "$GITHUB_OUTPUT"
          if [ -n "$(echo "$PROJECTS" | tr -d ' ')" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: steps.e2e.outputs.run == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.e2e.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (affected)
        if: steps.e2e.outputs.run == 'true'
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PREBUILT: "true"
        run: npx nx affected --target=e2e --parallel=1

      - name: E2E skipped (no affected projects)
        if: steps.e2e.outputs.run != 'true'
        run: echo "Skipping E2E — no affected projects with e2e target."

      - name: Show success message
        if: success()
        run: echo "✅ All checks passed for affected projects."
