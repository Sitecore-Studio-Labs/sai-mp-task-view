name: Testing Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Lint, Unit & Intergration Tests, Build, E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Build Next.js app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Next.js and run Playwright
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --port 3000 --hostname 0.0.0.0 > next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              echo "Server is up"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3000 >/dev/null; then
            echo "Server failed to start"
            cat next.log || true
            exit 1
          fi
          npm run e2e

      - name: Show success message
        if: success()
        run: echo "✅ All checks passed! Lint, tests, build, and E2E tests completed successfully."
