name: Testing Pipeline

permissions:
  contents: read
  # nx-set-shas needs to read the last successful workflow run to determine
  # the affected base SHA.
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Feature branches → develop (daily work).
    # develop → main (release PR) — also needs CI before it can merge.
    branches: [develop, main]

concurrency:
  group: testing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Unit & Integration Tests, Build, E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout (full history for NX affected)
        uses: actions/checkout@v4
        with:
          # Full history lets nrwl/nx-set-shas find the last successful run
          # commit, so nx affected only processes truly changed projects.
          fetch-depth: 0

      - name: Derive affected base/head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Security & compliance (always run — not affected-scoped) ──────────

      - name: Dependency audit
        run: npm run audit

      - name: Check dependency licenses
        run: npx license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Python-2.0;BlueOak-1.0.0;MPL-2.0;LGPL-2.0-only;LGPL-2.0-or-later;LGPL-2.1-only;LGPL-2.1-or-later;LGPL-3.0-only;LGPL-3.0-or-later;Artistic-2.0;Zlib;W3C' --excludePrivatePackages

      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      - name: Check shadow file coverage
        run: npm run check:shadows

      - name: Typecheck shadow components
        run: npm run typecheck:shadows

      - name: Check capability drift
        run: npm run check:capability-drift

      - name: Audit capabilities (all platform apps)
        # Runs 4 checks per platform: route stubs, provider sync, open TODOs,
        # and adapter template sync. Add new platforms to this list as they are added.
        run: npx nx run-many --target=audit-capabilities --projects=jira --parallel=3

      # ── NX affected: only run changed projects and their dependents ───────
      # NX_BASE and NX_HEAD are set by nrwl/nx-set-shas above.

      - name: Check formatting
        run: npm run format:check

      - name: Lint affected projects
        run: npx nx affected --target=lint --parallel=3

      - name: Typecheck affected projects
        run: npx nx affected --target=typecheck --parallel=3

      - name: Test affected projects
        run: npx nx affected --target=test --parallel=3 --coverage

      - name: Build affected projects
        run: npx nx affected --target=build --parallel=3

      # ── E2E: run only when the jira app or its deps are affected ──────────

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (affected)
        shell: bash
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PREBUILT: "true"
        run: npx nx affected --target=e2e --parallel=1

      - name: Show success message
        if: success()
        run: echo "✅ All checks passed for affected projects."
