# Capability matrix for the Wrike platform adapter.
# Each flag maps 1:1 to the PlatformCapabilities TypeScript interface.

platform:
  name: wrike
  displayName: Wrike
  connectionTitle: Connect to Wrike
  connectionDescription: >
    Link your Wrike account to manage tasks, projects, and workflows
    directly from the editor sidebar.

capabilities:
  hasIssueTypes: false # Wrike uses custom item types instead
  hasPriorities: false # Typically handled via custom fields
  hasAssignees: true # "responsibleIds" supported
  hasDueDate: true # Tasks support due dates
  hasParentIssue: true # Parent-child via folders/projects
  hasAttachments: true # Attachments API available
  hasComments: true # Comments API available
  hasSubtasks: true # Subtasks supported
  hasStatusTransitions: true # Workflow statuses & transitions
  hasAiWorkBreakdown: false # No native AI breakdown feature
  richTextFormat: plain # Wrike uses basic text/HTML-like formatting
  hasSites: true # Spaces / accounts (multi-tenant)
  hasOAuth: true # OAuth2 supported
